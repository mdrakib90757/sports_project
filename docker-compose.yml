version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kpl_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: kpl_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d kpl_db']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kpl_backend_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/kpl_db
      JWT_SECRET: kpl-season-3-super-secure-production-jwt-key
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
      ENABLE_DEMO_SEED: 'true'
    ports:
      - '4000:4000'

volumes:
  postgres_data:
    driver: local
